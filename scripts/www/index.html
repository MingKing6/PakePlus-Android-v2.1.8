<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>简易记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .balance-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .balance-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            color: #333;
        }

        .balance-amount.positive {
            color: #52c41a;
        }

        .balance-amount.negative {
            color: #ff4d4f;
        }

        .input-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .type-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .type-btn.active {
            border-color: #667eea;
            background: #f0f2ff;
            color: #667eea;
        }

        .type-btn.expense.active {
            border-color: #ff4d4f;
            background: #fff1f0;
            color: #ff4d4f;
        }

        .type-btn.income.active {
            border-color: #52c41a;
            background: #f6ffed;
            color: #52c41a;
        }

        .add-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .records-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .records-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .clear-btn {
            padding: 8px 15px;
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .record-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-item:hover {
            background: #fafafa;
        }

        .record-info {
            flex: 1;
        }

        .record-category {
            font-size: 14px;
            color: #666;
            margin-bottom: 3px;
        }

        .record-time {
            font-size: 12px;
            color: #999;
        }

        .record-amount-section {
            text-align: right;
        }

        .record-amount {
            font-size: 18px;
            font-weight: bold;
        }

        .record-amount.expense {
            color: #ff4d4f;
        }

        .record-amount.income {
            color: #52c41a;
        }

        .record-balance {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .delete-btn {
            padding: 5px 10px;
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* 滚动条样式 */
        .record-list::-webkit-scrollbar {
            width: 4px;
        }

        .record-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 2px;
        }

        .record-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>记账本</h1>
            <p>简单记录每一笔收支</p>
        </div>

        <div class="balance-card">
            <div class="balance-label">当前余额</div>
            <div class="balance-amount" id="balance">¥0.00</div>
        </div>

        <div class="input-section">
            <div class="type-selector">
                <button class="type-btn expense active" onclick="setType('expense')">支出</button>
                <button class="type-btn income" onclick="setType('income')">收入</button>
            </div>
            <div class="input-group">
                <label>金额</label>
                <input type="number" id="amount" placeholder="请输入金额" step="0.01">
            </div>
            <div class="input-group">
                <label>用途 / 备注</label>
                <input type="text" id="category" placeholder="例如：午餐、交通、工资...">
            </div>
            <button class="add-btn" onclick="addRecord()">记一笔</button>
        </div>

        <div class="records-section">
            <div class="records-header">
                <span class="records-title">收支记录</span>
                <button class="clear-btn" onclick="clearAll()">清空全部</button>
            </div>
            <div class="record-list" id="recordList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <p>暂无记录，开始记账吧！</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let currentType = 'expense';

        // 设置类型
        function setType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.type-btn.${type}`).classList.add('active');
        }

        // 添加记录
        function addRecord() {
            const amountInput = document.getElementById('amount');
            const categoryInput = document.getElementById('category');
            const amount = parseFloat(amountInput.value);
            const category = categoryInput.value.trim();

            if (!amount || amount <= 0) {
                alert('请输入有效的金额');
                return;
            }

            if (!category) {
                alert('请输入用途或备注');
                return;
            }

            const record = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: category,
                time: new Date().toLocaleString('zh-CN')
            };

            records.unshift(record);
            
            amountInput.value = '';
            categoryInput.value = '';
            
            renderRecords();
            updateBalance();
        }

        // 删除单条记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                records = records.filter(r => r.id !== id);
                renderRecords();
                updateBalance();
            }
        }

        // 清空所有记录
        function clearAll() {
            if (records.length === 0) return;
            if (confirm('确定要清空所有记录吗？此操作不可恢复！')) {
                records = [];
                renderRecords();
                updateBalance();
            }
        }

        // 渲染记录列表
        function renderRecords() {
            const listContainer = document.getElementById('recordList');
            
            if (records.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <p>暂无记录，开始记账吧！</p>
                    </div>
                `;
                return;
            }

            let runningBalance = 0;
            const recordsWithBalance = [];

            // 计算每条记录后的余额（从最早到最新）
            for (let i = records.length - 1; i >= 0; i--) {
                const record = records[i];
                if (record.type === 'income') {
                    runningBalance += record.amount;
                } else {
                    runningBalance -= record.amount;
                }
                recordsWithBalance.unshift({
                    ...record,
                    balance: runningBalance
                });
            }

            listContainer.innerHTML = recordsWithBalance.map(record => `
                <div class="record-item">
                    <div class="record-info">
                        <div class="record-category">${record.category}</div>
                        <div class="record-time">${record.time}</div>
                    </div>
                    <div class="record-amount-section">
                        <div class="record-amount ${record.type}">
                            ${record.type === 'expense' ? '-' : '+'}¥${record.amount.toFixed(2)}
                        </div>
                        <div class="record-balance">余额: ¥${record.balance.toFixed(2)}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteRecord(${record.id})">删除</button>
                </div>
            `).join('');
        }

        // 更新余额显示
        function updateBalance() {
            let balance = 0;
            records.forEach(record => {
                if (record.type === 'income') {
                    balance += record.amount;
                } else {
                    balance -= record.amount;
                }
            });

            const balanceElement = document.getElementById('balance');
            balanceElement.textContent = `¥${balance.toFixed(2)}`;
            balanceElement.className = 'balance-amount' + (balance >= 0 ? ' positive' : ' negative');
        }

        // 回车键提交
        document.getElementById('category').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addRecord();
            }
        });

        // 初始化
        renderRecords();
        updateBalance();
    </script>
</body>
</html>
